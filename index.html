<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAONA Workspace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">SAONA<span>Workspace</span></div>
      <nav id="nav"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h1 id="pageTitle"></h1>
        <div class="topbar-actions">
          <button class="btn ghost" id="exportBtn">Exporter</button>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button type="button" class="icon-btn" id="modalClose" aria-label="Fermer">✕</button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
